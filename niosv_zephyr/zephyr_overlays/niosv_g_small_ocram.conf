# The small on-chip RAM hardware variant (hw: dataCacheSize 8192, ram0 68 KB;
# niosv_zephyr/hw_a065dc): the data in the HyperRAM behind the Nios V/g data
# cache - Zephyr's cache API on zephyr_module's cache_niosv.c. MCUboot and the
# application both.
CONFIG_AXC3000_NIOSV_CACHE=y
CONFIG_AXC3000_NIOSV_DCACHE_SIZE=8192
CONFIG_EXTERNAL_CACHE=y
CONFIG_CACHE_MANAGEMENT=y
