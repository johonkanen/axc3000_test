# An application for MCUboot RAM-load (mcuboot/mcuboot.conf): linked XIP for
# the HyperRAM's code half (niosv_g_hyperram_xip.overlay), with the 0x200
# bytes of image header space at its start (ROM_START_OFFSET follows from
# BOOTLOADER_MCUBOOT). MCUboot copies the whole image, header included, to
# 0x01000000 and jumps to 0x01000200 - Zephyr's __start.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_BOOTLOADER_MODE_RAM_LOAD=y
# Zephyr's own signing takes the load address from zephyr,sram (the on-chip
# RAM here) - mcuboot/sign_app.sh signs with the HyperRAM address instead
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE=""

# code in the HyperRAM (niosv_g_hyperram_xip.overlay)
CONFIG_XIP=y
