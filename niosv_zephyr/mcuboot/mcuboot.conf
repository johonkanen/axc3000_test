# MCUboot for the AXC3000 Nios V/g (see build_mcuboot.sh)

# RAM-load: the image is copied from its flash slot into the HyperRAM's code
# half (zephyr_overlays/niosv_g_hyperram_xip.overlay) and run there
CONFIG_BOOT_RAM_LOAD=y
CONFIG_BOOT_IMAGE_EXECUTABLE_RAM_START=0x01000000
CONFIG_BOOT_IMAGE_EXECUTABLE_RAM_SIZE=8388608

# serial recovery over the FTDI UART (uart1), waiting a second at boot
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=1000
# no valid image in either slot: stay in serial recovery
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
CONFIG_BOOT_SERIAL_IMG_GRP_IMAGE_STATE=y
# large SMP packets (the defaults are 128-byte lines, 1 KB packets: ~15 kB/s
# at 4.8 MBaud); the host must match: smpmgr --line-length 4096 --line-buffers 4
CONFIG_BOOT_MAX_LINE_INPUT_LEN=4096
CONFIG_BOOT_LINE_BUFS=4
CONFIG_BOOT_SERIAL_MAX_RECEIVE_SIZE=16384

# the QSPI flash driver (zephyr_module) and its page layout
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y

# the HyperRAM must be calibrated before the copy - the axc3000 module's
# hyperram init does that (no heap needed, so small heaps are fine)
CONFIG_AXC3000_HYPERRAM=n

# tell the application which slot it was loaded from (image management
# needs it in RAM-load mode): zephyr_overlays/niosv_g_bootinfo.overlay
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETAINED_MEM_ZEPHYR_RAM=y
CONFIG_BOOT_SHARE_DATA=y
CONFIG_BOOT_SHARE_DATA_BOOTINFO=y
CONFIG_BOOT_SHARE_BACKEND_RETENTION=y

CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
