CONFIG_PRINTK=y
CONFIG_SYS_HEAP_AUTO=y

# mcumgr / SMP over uart1 (the FTDI UART)
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
# large frames: the host uses smpmgr --line-length 4096 --line-buffers 4,
# which makes ~12 KB frames - a frame larger than the net_buf is dropped
# silently (the upload then times out), so 16 KB, as MCUboot's
CONFIG_MCUMGR_TRANSPORT_UART_MTU=16384
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=16384
CONFIG_UART_MCUMGR_RX_BUF_SIZE=4096
# one per line of a frame (smpmgr --line-buffers 4); fewer drop fragments
CONFIG_UART_MCUMGR_RX_BUF_COUNT=4
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048

# image upload into the QSPI flash slots, reset
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
# erase as the image arrives, not the whole 4 MB slot before the first reply
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_REBOOT=y

# which slot MCUboot loaded (RAM-load), from niosv_g_bootinfo.overlay
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETAINED_MEM_ZEPHYR_RAM=y
CONFIG_RETENTION_BOOTLOADER_INFO=y
CONFIG_RETENTION_BOOTLOADER_INFO_TYPE_MCUBOOT=y

# warnings on the JTAG console (e.g. uart_mcumgr dropping fragments)
CONFIG_LOG=y
